name: build clinics-tools.user.js
on:
  push:
    branches: [main]
    paths: ['*.user.js', 'build.py', '!clinics-tools.user.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add clinics-tools.user.js
          git diff --cached --quiet || (git commit -m "Rebuild clinics-tools.user.js" && git push)
